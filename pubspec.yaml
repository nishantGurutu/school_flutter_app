name: school_desk_app
description: "A new Flutter project." 
publish_to: 'none'  
version: 1.0.0+1

environment:
  sdk: ^3.11.5
 
dependencies:
  flutter:
    sdk: flutter
 
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  dio: ^5.9.0
  flutter_screenutil: ^5.9.3 
  flutter_secure_storage: ^10.0.0
  geolocator: ^14.1.1
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.3
  flutter_html: ^3.0.0
  posthog_flutter: ^5.55.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  permission_handler: ^13.0.2
  flutter_background_service: ^5.1.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
 
dev_dependencies:
  flutter_test:
    sdk: flutter
 
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.0+3
  google_maps_flutter_platform_interface: ^2.17.0
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/school_icon.png"
  min_sdk_android: 21  
   

dependency_overrides:
  html: 0.15.6
  permission_handler_android: 13.0.1
 
flutter:
 
  uses-material-design: true 
  assets:
    - assets/
    - assets/img/